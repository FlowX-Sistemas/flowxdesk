# Compila o APK do FlowXDesk: RustDesk oficial (tag) + scripts/brand.py.
# Passos copiados do job build-rustdesk-android do CI do RustDesk (flutter-build.yml).
# Secrets: RENDEZVOUS_SERVER, RS_PUB_KEY, RENDEZVOUS_SERVER_LAN (opcional),
#          ANDROID_SIGNING_KEY (keystore em base64), ANDROID_ALIAS, ANDROID_KEY_STORE_PASSWORD, ANDROID_KEY_PASSWORD.
name: android
on:
  workflow_dispatch:
    inputs:
      rustdesk-tag:
        description: "Tag do RustDesk"
        default: "1.5.3"
permissions:
  contents: read
env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  FLUTTER_VERSION: "3.24.5"
  FRB_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  apk-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with: { tool-cache: false, android: false, dotnet: true, haskell: true, large-packages: false, docker-images: true, swap-storage: false }

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl git g++ libclang-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config libgtk-3-dev python3-pil

      - name: Checkout FlowXDesk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout RustDesk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.rustdesk-tag }}
          path: src
          submodules: recursive

      - name: Apply FlowX branding
        run: python3 scripts/brand.py src

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { channel: stable, flutter-version: "${{ env.FLUTTER_VERSION }}" }

      - name: Patch flutter
        run: cd $(dirname $(dirname $(which flutter))) && git apply $GITHUB_WORKSPACE/src/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with: { toolchain: "${{ env.RUST_VERSION }}", targets: aarch64-linux-android, components: rustfmt }

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: src, key: aarch64-linux-android }

      - name: Generate Rust<->Dart bridge
        working-directory: src
        run: |
          cargo install cargo-expand --version $CARGO_EXPAND_VERSION --locked
          cargo install flutter_rust_bridge_codegen --version $FRB_VERSION --features uuid --locked
          (cd flutter && flutter pub get)
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with: { ndk-version: "${{ env.NDK_VERSION }}", add-to-path: true }

      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with: { vcpkgDirectory: /opt/artifacts/vcpkg, vcpkgGitCommitId: "${{ env.VCPKG_COMMIT_ID }}", doNotCache: false }

      - name: Install vcpkg dependencies
        working-directory: src
        env: { ANDROID_NDK_HOME: "${{ steps.setup-ndk.outputs.ndk-path }}" }
        run: ./flutter/build_android_deps.sh arm64-v8a

      - name: Build rustdesk lib
        working-directory: src
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RENDEZVOUS_SERVER_LAN: ${{ secrets.RENDEZVOUS_SERVER_LAN }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        run: |
          test -n "$RENDEZVOUS_SERVER" && test -n "$RS_PUB_KEY"
          # secret vazio não pode virar servidor "" no option_env!
          if [ -z "$RENDEZVOUS_SERVER_LAN" ]; then unset RENDEZVOUS_SERVER_LAN; fi
          cargo install cargo-ndk --version $CARGO_NDK_VERSION --locked
          ./flutter/ndk_arm64.sh

      - name: Build APK
        working-directory: src
        env: { JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64, ANDROID_NDK_HOME: "${{ steps.setup-ndk.outputs.ndk-path }}" }
        run: |
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          J=./flutter/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p $J
          cp $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so $J/
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so $J/librustdesk.so
          (cd flutter && flutter build apk --release --target-platform android-arm64 --split-per-abi)
          mkdir -p ../signed-apk
          mv flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../signed-apk/FlowXDesk-${{ inputs.rustdesk-tag }}-arm64.apk

      - name: Sign APK
        id: sign
        run: |
          BT=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > ks.jks
          F=signed-apk/FlowXDesk-${{ inputs.rustdesk-tag }}-arm64.apk
          /usr/local/lib/android/sdk/build-tools/$BT/apksigner sign --ks ks.jks --ks-key-alias "${{ secrets.ANDROID_ALIAS }}" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "${F%.apk}-signed.apk" "$F"
          rm ks.jks "$F"
        env:
          KS_PASS: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # O APK leva o servidor embutido: artefato curto, baixar e distribuir por fora.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FlowXDesk-android-arm64
          path: signed-apk/*.apk
          retention-days: 1
